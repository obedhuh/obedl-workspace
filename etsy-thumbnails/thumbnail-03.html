<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Coloring Pages Thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:2000px;height:2000px;overflow:hidden;}
.canvas{
  width:2000px;height:2000px;position:relative;
  background:linear-gradient(160deg,#fef0f8 0%,#f0faf4 50%,#f0f4ff 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:40px;overflow:hidden;
}
.b1{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(255,182,213,.3),transparent 70%);top:-100px;left:-150px;}
.b2{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(182,240,195,.25),transparent 70%);bottom:-100px;right:-100px;}
.b3{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(182,213,255,.2),transparent 70%);top:300px;right:200px;}

.badge-best{position:absolute;top:64px;left:64px;background:linear-gradient(135deg,#ff80b4,#ff5a9d);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:34px;padding:18px 34px;border-radius:24px;box-shadow:0 8px 28px rgba(255,90,157,.4);z-index:10;letter-spacing:.5px;}
.badge-sale{position:absolute;top:64px;right:64px;background:linear-gradient(135deg,#7ed95e,#52b73b);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:52px;padding:16px 32px;border-radius:24px;box-shadow:0 8px 28px rgba(82,183,59,.4);z-index:10;line-height:1;}

.eyebrow{font-family:'DM Sans',sans-serif;font-weight:700;font-size:26px;color:#ff80b4;text-transform:uppercase;letter-spacing:8px;margin-top:80px;}
.hero-num{font-family:'Nunito',sans-serif;font-weight:900;font-size:310px;line-height:.85;background:linear-gradient(160deg,#ff80b4,#b08aff,#7ed95e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-sub{font-family:'Nunito',sans-serif;font-weight:900;font-size:72px;color:#444;letter-spacing:6px;margin-top:-8px;}
.hero-type{font-family:'DM Sans',sans-serif;font-size:28px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:5px;}

/* grid of coloring thumbnails */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:800px;}
.cell{aspect-ratio:1;border-radius:16px;background:#fff;border:2px solid #f0e8f8;display:flex;align-items:center;justify-content:center;font-size:64px;box-shadow:0 4px 16px rgba(0,0,0,.06);}
.cell:nth-child(1){background:#fff8fd;}
.cell:nth-child(2){background:#f8fff9;}
.cell:nth-child(3){background:#f8f8ff;}
.cell:nth-child(4){background:#fffaf5;}
.cell:nth-child(5){background:#fff5f8;}
.cell:nth-child(6){background:#f5fff8;}
.cell:nth-child(7){background:#f8f5ff;}
.cell:nth-child(8){background:#fffff5;}

/* SVG coloring outlines inside cells */
.col-icon{width:70%;height:70%;opacity:.7;}

.stats-row{display:flex;gap:36px;align-items:center;}
.stat{text-align:center;}
.sn{font-family:'Nunito',sans-serif;font-weight:900;font-size:72px;line-height:1;}
.sl{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:2px;}
.sn1{color:#ff80b4;}.sn2{color:#b08aff;}.sn3{color:#7ed95e;}
.sdiv{width:2px;height:60px;background:#eee;}

.fmts{display:flex;gap:16px;}
.fmt{padding:12px 28px;border-radius:24px;font-family:'DM Sans',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;}
.fa{background:#fff;border:2px solid #f0e0f8;color:#c0a0d8;}
.fb{background:linear-gradient(135deg,#ff80b4,#c060d0);color:#fff;box-shadow:0 4px 16px rgba(255,128,180,.3);}
</style>
</head>
<body>
<div class="canvas">
  <div class="b1"></div><div class="b2"></div><div class="b3"></div>
  <div class="badge-best">⭐ Bestseller</div>
  <div class="badge-sale">75% OFF</div>
  <div class="eyebrow">Kawaii Coloring Pages Bundle</div>
  <div class="hero-num">4000+</div>
  <div class="hero-sub">Pages</div>
  <div class="grid">
    <div class="cell">🐱</div><div class="cell">🐻</div><div class="cell">🌸</div><div class="cell">🦋</div>
    <div class="cell">🌙</div><div class="cell">🐰</div><div class="cell">🌺</div><div class="cell">🦊</div>
  </div>
  <div class="stats-row">
    <div class="stat"><div class="sn sn1">300 DPI</div><div class="sl">Print Quality</div></div>
    <div class="sdiv"></div>
    <div class="stat"><div class="sn sn2">PDF</div><div class="sl">+ PNG Files</div></div>
    <div class="sdiv"></div>
    <div class="stat"><div class="sn sn3">A4 + Letter</div><div class="sl">Both Sizes</div></div>
  </div>
  <div class="fmts">
    <div class="fmt fb">⚡ Instant Download</div>
    <div class="fmt fa">PDF</div>
    <div class="fmt fa">Printable</div>
  </div>
</div>
</body>
</html>
