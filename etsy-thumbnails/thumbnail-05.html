<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Canva PLR Templates Thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:2000px;height:2000px;overflow:hidden;}
.canvas{
  width:2000px;height:2000px;position:relative;
  background:#0f0f1a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:48px;overflow:hidden;
}
.bg-glow1{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.2),transparent 65%);top:-200px;left:-300px;}
.bg-glow2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.15),transparent 65%);bottom:-150px;right:-200px;}
.bg-glow3{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.1),transparent 65%);top:600px;right:100px;}

.badge-best{position:absolute;top:64px;left:64px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:'DM Sans',sans-serif;font-weight:700;font-size:30px;padding:18px 34px;border-radius:8px;text-transform:uppercase;letter-spacing:2px;z-index:10;}
.badge-sale{position:absolute;top:64px;right:64px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-family:'Syne',sans-serif;font-size:52px;font-weight:800;padding:16px 36px;border-radius:8px;box-shadow:0 0 40px rgba(99,102,241,.5);z-index:10;}

.eyebrow{font-family:'DM Sans',sans-serif;font-weight:700;font-size:24px;color:#6366f1;text-transform:uppercase;letter-spacing:8px;margin-top:80px;}
.hero-num{font-family:'Syne',sans-serif;font-size:320px;font-weight:800;line-height:.85;background:linear-gradient(135deg,#6366f1,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-sub{font-family:'Syne',sans-serif;font-size:68px;font-weight:800;color:#fff;letter-spacing:6px;}
.hero-type{font-family:'DM Sans',sans-serif;font-size:26px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:5px;margin-top:-4px;}

/* Template preview cards */
.tmpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:860px;}
.tmpl-card{border-radius:12px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);aspect-ratio:.7;}
.tmpl-card .tc-header{height:30%;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;color:#fff;}
.tmpl-card .tc-lines{padding:10px;display:flex;flex-direction:column;gap:6px;}
.tc-line{border-radius:4px;height:8px;background:rgba(255,255,255,.15);}
.tc-line.short{width:60%;}
.tc-line.medium{width:80%;}
.tc-line.full{width:100%;}
.tc-line.color{background:rgba(99,102,241,.5);}
.tc-btn{margin:8px 10px 0;border-radius:4px;height:22px;background:rgba(99,102,241,.4);}

.tcol1 .tc-header{background:linear-gradient(135deg,rgba(99,102,241,.6),rgba(139,92,246,.6));}
.tcol2 .tc-header{background:linear-gradient(135deg,rgba(236,72,153,.6),rgba(249,115,22,.4));}
.tcol3 .tc-header{background:linear-gradient(135deg,rgba(34,211,238,.5),rgba(99,102,241,.5));}
.tcol4 .tc-header{background:linear-gradient(135deg,rgba(52,211,153,.5),rgba(99,102,241,.4));}

.callout{display:flex;gap:0;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.1);}
.co-item{flex:1;text-align:center;padding:20px 28px;background:rgba(255,255,255,.04);}
.co-item+.co-item{border-left:1px solid rgba(255,255,255,.1);}
.co-num{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:#a78bfa;}
.co-lbl{font-size:13px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;}

.fmts{display:flex;gap:14px;}
.fmt{padding:12px 28px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.fa{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);}
.fb{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.4);}
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-glow1"></div><div class="bg-glow2"></div><div class="bg-glow3"></div>
  <div class="badge-best">⭐ Bestseller</div>
  <div class="badge-sale">75% OFF</div>
  <div class="eyebrow">Canva PLR Template Bundle</div>
  <div class="hero-num">500+</div>
  <div class="hero-sub">Templates</div>
  <div class="hero-type">Editable · Rebrandable · Resellable</div>
  <div class="tmpl-grid">
    <div class="tmpl-card tcol1">
      <div class="tc-header">Instagram</div>
      <div class="tc-lines">
        <div class="tc-line full color"></div>
        <div class="tc-line medium"></div>
        <div class="tc-line short"></div>
        <div class="tc-line full"></div>
        <div class="tc-btn"></div>
      </div>
    </div>
    <div class="tmpl-card tcol2">
      <div class="tc-header">Stories</div>
      <div class="tc-lines">
        <div class="tc-line full color"></div>
        <div class="tc-line medium"></div>
        <div class="tc-line full"></div>
        <div class="tc-line short"></div>
        <div class="tc-btn"></div>
      </div>
    </div>
    <div class="tmpl-card tcol3">
      <div class="tc-header">Pinterest</div>
      <div class="tc-lines">
        <div class="tc-line medium color"></div>
        <div class="tc-line full"></div>
        <div class="tc-line medium"></div>
        <div class="tc-line full"></div>
        <div class="tc-btn"></div>
      </div>
    </div>
    <div class="tmpl-card tcol4">
      <div class="tc-header">Facebook</div>
      <div class="tc-lines">
        <div class="tc-line full color"></div>
        <div class="tc-line short"></div>
        <div class="tc-line full"></div>
        <div class="tc-line medium"></div>
        <div class="tc-btn"></div>
      </div>
    </div>
  </div>
  <div class="callout">
    <div class="co-item"><div class="co-num">PLR</div><div class="co-lbl">Full License</div></div>
    <div class="co-item"><div class="co-num">Canva</div><div class="co-lbl">Editable Links</div></div>
    <div class="co-item"><div class="co-num">Rebrand</div><div class="co-lbl">& Resell</div></div>
    <div class="co-item"><div class="co-num">10 Niches</div><div class="co-lbl">Included</div></div>
  </div>
  <div class="fmts">
    <div class="fmt fb">⚡ Instant Download</div>
    <div class="fmt fa">Canva Links</div>
    <div class="fmt fa">PLR Rights</div>
    <div class="fmt fa">All Platforms</div>
  </div>
</div>
</body>
</html>
