<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clipart Bundle Thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:2000px;height:2000px;overflow:hidden;}
.canvas{
  width:2000px;height:2000px;position:relative;
  background:linear-gradient(150deg,#e8eef5 0%,#f5eaf0 50%,#eef0f8 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:44px;overflow:hidden;
}
.w1{position:absolute;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(180,200,230,.25),transparent 70%);top:-200px;right:-200px;}
.w2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(220,180,200,.2),transparent 70%);bottom:-200px;left:-150px;}

.badge-best{position:absolute;top:64px;left:64px;background:#4a5568;color:#fff;font-family:'DM Sans',sans-serif;font-weight:700;font-size:30px;padding:18px 34px;border-radius:6px;text-transform:uppercase;letter-spacing:2px;box-shadow:0 6px 20px rgba(74,85,104,.35);z-index:10;}
.badge-sale{position:absolute;top:64px;right:64px;background:linear-gradient(135deg,#c9a96e,#a07840);color:#fff;font-family:'Playfair Display',serif;font-size:52px;font-weight:700;padding:16px 32px;border-radius:6px;box-shadow:0 6px 24px rgba(160,120,64,.35);z-index:10;}

.eyebrow{font-family:'DM Sans',sans-serif;font-weight:700;font-size:26px;color:#6b7a8d;text-transform:uppercase;letter-spacing:8px;margin-top:90px;}
.hero-num{font-family:'Playfair Display',serif;font-size:300px;font-weight:700;color:#2d3748;line-height:.85;}
.hero-sub{font-family:'DM Sans',sans-serif;font-size:60px;font-weight:700;color:#6b7a8d;text-transform:uppercase;letter-spacing:10px;}

/* floral SVG grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:780px;}
.cell{aspect-ratio:1;border-radius:14px;background:#fff;border:1px solid rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.05);overflow:hidden;}
.cell svg{width:75%;height:75%;}

.callout{
  display:flex;gap:24px;align-items:center;
  background:#fff;border:1px solid rgba(0,0,0,.06);
  border-radius:10px;padding:18px 36px;
  box-shadow:0 4px 16px rgba(0,0,0,.04);
}
.co-item{text-align:center;}
.co-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:#4a5568;}
.co-lbl{font-size:14px;font-weight:600;color:#9aa;text-transform:uppercase;letter-spacing:1.5px;}
.co-div{width:1px;height:40px;background:#eee;}

.fmts{display:flex;gap:16px;}
.fmt{padding:12px 28px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.fa{background:#fff;border:1px solid #ddd;color:#6b7a8d;}
.fb{background:#4a5568;color:#fff;}
</style>
</head>
<body>
<div class="canvas">
  <div class="w1"></div><div class="w2"></div>
  <div class="badge-best">⭐ Bestseller</div>
  <div class="badge-sale">75% OFF</div>
  <div class="eyebrow">Watercolor Floral Clipart Bundle</div>
  <div class="hero-num">300+</div>
  <div class="hero-sub">Designs</div>
  <div class="grid">
    <!-- SVG floral cells -->
    <div class="cell"><svg viewBox="0 0 100 100" fill="none" stroke="#c9a96e" stroke-width="2">
      <circle cx="50" cy="50" r="18"/><ellipse cx="50" cy="20" rx="14" ry="22" transform="rotate(0,50,50)"/><ellipse cx="50" cy="20" rx="14" ry="22" transform="rotate(60,50,50)"/><ellipse cx="50" cy="20" rx="14" ry="22" transform="rotate(120,50,50)"/><ellipse cx="50" cy="20" rx="14" ry="22" transform="rotate(180,50,50)"/><ellipse cx="50" cy="20" rx="14" ry="22" transform="rotate(240,50,50)"/><ellipse cx="50" cy="20" rx="14" ry="22" transform="rotate(300,50,50)"/>
    </svg></div>
    <div class="cell"><svg viewBox="0 0 100 100" fill="none" stroke="#b08090" stroke-width="2">
      <path d="M50,20 Q65,35 65,50 Q65,70 50,78 Q35,70 35,50 Q35,35 50,20Z"/><path d="M50,20 Q35,35 35,50 Q35,70 50,78" stroke-dasharray="3,3"/>
      <path d="M30,30 Q40,25 50,30"/><path d="M70,30 Q60,25 50,30"/>
    </svg></div>
    <div class="cell"><svg viewBox="0 0 100 100" fill="none" stroke="#90a0b0" stroke-width="2">
      <circle cx="50" cy="50" r="12"/><path d="M50,15 L53,42 L50,15 L47,42"/><path d="M85,50 L58,53 L85,50 L58,47"/><path d="M50,85 L53,58 L50,85 L47,58"/><path d="M15,50 L42,53 L15,50 L42,47"/>
      <path d="M74,26 L55,46 L74,26 L54,47"/><path d="M74,74 L54,53 L74,74 L55,54"/><path d="M26,74 L45,53 L26,74 L46,54"/><path d="M26,26 L46,46 L26,26 L45,47"/>
    </svg></div>
    <div class="cell"><svg viewBox="0 0 100 100" fill="none" stroke="#a0b888" stroke-width="2">
      <path d="M50,80 Q50,30 50,20"/><path d="M50,55 Q35,45 30,30 Q45,38 50,52"/><path d="M50,65 Q65,55 70,40 Q55,48 50,62"/>
      <circle cx="50" cy="20" r="8"/>
    </svg></div>
    <div class="cell"><svg viewBox="0 0 100 100" fill="none" stroke="#c0a0d8" stroke-width="2">
      <circle cx="50" cy="50" r="10"/><ellipse cx="50" cy="28" rx="10" ry="16"/><ellipse cx="50" cy="28" rx="10" ry="16" transform="rotate(72,50,50)"/><ellipse cx="50" cy="28" rx="10" ry="16" transform="rotate(144,50,50)"/><ellipse cx="50" cy="28" rx="10" ry="16" transform="rotate(216,50,50)"/><ellipse cx="50" cy="28" rx="10" ry="16" transform="rotate(288,50,50)"/>
    </svg></div>
    <div class="cell"><svg viewBox="0 0 100 100" fill="none" stroke="#d4a078" stroke-width="2">
      <path d="M30,75 Q50,70 70,75 Q65,55 50,45 Q35,55 30,75Z"/><path d="M50,45 L50,25"/><path d="M50,35 Q40,30 35,20 Q45,25 50,33"/><path d="M50,40 Q60,30 65,20 Q55,28 50,38"/>
    </svg></div>
    <div class="cell"><svg viewBox="0 0 100 100" fill="none" stroke="#88b8c0" stroke-width="2">
      <circle cx="50" cy="45" r="22"/><path d="M50,67 Q48,80 50,88 Q52,80 50,67"/>
      <path d="M32,55 Q20,65 18,78 Q30,68 33,57"/><path d="M68,55 Q80,65 82,78 Q70,68 67,57"/>
    </svg></div>
    <div class="cell"><svg viewBox="0 0 100 100" fill="none" stroke="#c8a0a8" stroke-width="2">
      <path d="M50,50 Q30,30 28,15 Q42,28 50,48"/><path d="M50,50 Q70,30 72,15 Q58,28 50,48"/><path d="M50,50 Q25,50 15,40 Q30,48 49,50"/><path d="M50,50 Q75,50 85,40 Q70,48 51,50"/><path d="M50,50 Q30,70 28,85 Q42,72 50,52"/><path d="M50,50 Q70,70 72,85 Q58,72 50,52"/>
    </svg></div>
    <div class="cell"><svg viewBox="0 0 100 100" fill="none" stroke="#b0c8a0" stroke-width="2">
      <ellipse cx="50" cy="50" rx="20" ry="28" transform="rotate(-30,50,50)"/>
      <ellipse cx="50" cy="50" rx="20" ry="28" transform="rotate(30,50,50)"/>
      <ellipse cx="50" cy="50" rx="20" ry="28" transform="rotate(90,50,50)"/>
      <circle cx="50" cy="50" r="8" fill="#fff"/>
    </svg></div>
  </div>
  <div class="callout">
    <div class="co-item"><div class="co-num">300 DPI</div><div class="co-lbl">Resolution</div></div>
    <div class="co-div"></div>
    <div class="co-item"><div class="co-num">Transparent</div><div class="co-lbl">Background</div></div>
    <div class="co-div"></div>
    <div class="co-item"><div class="co-num">Commercial</div><div class="co-lbl">Use License</div></div>
  </div>
  <div class="fmts">
    <div class="fmt fb">⚡ Instant Download</div>
    <div class="fmt fa">SVG</div>
    <div class="fmt fa">PNG</div>
    <div class="fmt fa">Commercial Use</div>
  </div>
</div>
</body>
</html>
